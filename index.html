<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Casino Bonus Comparison</title>
    <meta name="description" content="Compare welcome bonuses, wagering requirements and minimum deposits across online casinos.">
    <style>
        /* ── Reset & Base Styles ─────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #0c0e14;
            --surface:     #141824;
            --surface-hover: #1c2234;
            --border:      #262d40;
            --text-main:   #f1f5f9;
            --text-muted:  #94a3b8;
            --primary:     #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.15);
            --bonus-accent:#10b981;
            --wager-accent:#f59e0b;
            --deposit-accent:#38bdf8;
            --radius:      12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Container ───────────────────────────────────── */
        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.25rem;
            flex: 1;
        }

        /* ── Header ──────────────────────────────────────── */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-glow);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.35);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.35em 0.85em;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.85rem;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            display: inline-block;
        }

        header h1 {
            font-size: clamp(1.6rem, 4vw, 2.3rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* ── Table (Desktop View) ────────────────────────── */
        .table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #101420;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1.1rem 1.25rem;
            font-size: 0.92rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: var(--surface-hover);
        }

        .casino-cell {
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
        }

        .bonus-value {
            color: var(--bonus-accent);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .wager-value {
            color: var(--wager-accent);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .deposit-value {
            color: var(--deposit-accent);
            font-weight: 600;
        }

        .source-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .source-btn:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--primary);
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* ── Cards (Mobile View) ─────────────────────────── */
        .cards-view {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .casino-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.35rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .casino-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .casino-card-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .card-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.85rem;
            margin-bottom: 1.1rem;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .stat-item.full-width {
            grid-column: span 2;
        }

        .stat-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .stat-val {
            font-size: 0.95rem;
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
        }

        /* ── Loading & Errors ────────────────────────────── */
        .state-message {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .state-message.error {
            color: #f87171;
        }

        /* ── Footer ──────────────────────────────────────── */
        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
            font-size: 0.82rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        footer a {
            color: #a5b4fc;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* ── Responsive Query ────────────────────────────── */
        @media (max-width: 680px) {
            .table-wrapper { display: none; }
            .cards-view { display: flex; }
            .container { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Casino Bonus Comparison</h1>
            <p>Compare welcome bonuses and promotional terms across verified casinos</p>
        </header>

        <main id="app">
            <div class="state-message">Loading bonus dataset…</div>
        </main>

        <footer>
            <p>Data source: <span id="source-name">Public Comparison Directory</span> · Last updated: <span id="scraped-date">—</span></p>
        </footer>
    </div>

    <script>
        (async function () {
            const app = document.getElementById("app");
            const dateEl = document.getElementById("scraped-date");
            const sourceEl = document.getElementById("source-name");

            try {
                const resp = await fetch("data/casinos.json");
                if (!resp.ok) {
                    throw new Error(`Could not load data/casinos.json (HTTP ${resp.status})`);
                }
                const data = await resp.json();

                // Format metadata
                if (data.scraped_at) {
                    const dateObj = new Date(data.scraped_at);
                    dateEl.textContent = dateObj.toLocaleDateString("en-GB", {
                        day: "numeric",
                        month: "short",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                        timeZoneName: "short"
                    });
                }
                if (data.source) {
                    sourceEl.innerHTML = `<a href="${esc(data.source)}" target="_blank" rel="noopener">${esc(data.source.replace('https://', ''))}</a>`;
                }

                if (!data.casinos || data.casinos.length === 0) {
                    app.innerHTML = '<div class="state-message error">No casinos found in data/casinos.json.</div>';
                    return;
                }

                // ── Desktop Table ───────────────────────────
                let tableHtml = `
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Casino Name</th>
                                    <th>Welcome Bonus</th>
                                    <th>Wagering (Multiplier)</th>
                                    <th>Min Deposit</th>
                                    <th>Source Page</th>
                                </tr>
                            </thead>
                            <tbody>`;

                for (const item of data.casinos) {
                    // Extract just the clean multiplier number (e.g. '35' from '35(b+d)' or '35x')
                    const match = String(item.wagering_requirement || '').match(/\d+/);
                    const wagerText = match ? `${match[0]}x` : (item.wagering_requirement || 'N/A');

                    tableHtml += `
                        <tr>
                            <td class="casino-cell">${esc(item.casino_name)}</td>
                            <td class="bonus-value">${esc(item.welcome_bonus)}</td>
                            <td class="wager-value">${wagerText}</td>
                            <td class="deposit-value">${esc(item.min_deposit)}</td>
                            <td>
                                <a class="source-btn" href="${esc(item.source_url)}" target="_blank" rel="noopener">
                                    Source ↗
                                </a>
                            </td>
                        </tr>`;
                }

                tableHtml += `</tbody></table></div>`;

                // ── Mobile Cards ────────────────────────────
                let cardsHtml = '<div class="cards-view">';
                for (const item of data.casinos) {
                    const match = String(item.wagering_requirement || '').match(/\d+/);
                    const wagerText = match ? `${match[0]}x` : (item.wagering_requirement || 'N/A');

                    cardsHtml += `
                        <article class="casino-card">
                            <div class="casino-card-header">
                                <h2>${esc(item.casino_name)}</h2>
                                <a class="source-btn" href="${esc(item.source_url)}" target="_blank" rel="noopener">
                                    Source ↗
                                </a>
                            </div>
                            <div class="card-stats">
                                <div class="stat-item full-width">
                                    <div class="stat-label">Welcome Bonus</div>
                                    <div class="stat-val bonus-value">${esc(item.welcome_bonus)}</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Wagering Multiplier</div>
                                    <div class="stat-val wager-value">${wagerText}</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Minimum Deposit</div>
                                    <div class="stat-val deposit-value">${esc(item.min_deposit)}</div>
                                </div>
                            </div>
                        </article>`;
                }
                cardsHtml += '</div>';

                app.innerHTML = tableHtml + cardsHtml;

            } catch (err) {
                app.innerHTML = `<div class="state-message error">${esc(err.message)}</div>`;
            }
        })();

        function esc(val) {
            if (val === null || val === undefined) return "";
            const div = document.createElement("div");
            div.textContent = String(val);
            return div.innerHTML;
        }
    </script>
</body>
</html>
